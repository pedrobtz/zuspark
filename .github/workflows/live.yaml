# The live tests (design §9): Spark Connect 4.2.1 in Docker on Ubuntu, the
# one runner with Docker, from zugrpc's `spark` job. Separate from
# R-CMD-check.yaml, whose checks never touch a network; there, the live
# tests skip and the recorded fixtures stand in for the server.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: live

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# get a group of their own, so every merge is checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  spark:
    runs-on: ubuntu-latest
    name: spark connect (ubuntu-latest)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # In the foreground of its container (SPARK_NO_DAEMONIZE), listening
      # on every interface so that the published port reaches it. Started
      # first, so that it boots while R and the packages install.
      - name: Start Spark Connect 4.2.1
        run: |
          docker run -d --name spark -p 15002:15002 \
            -e SPARK_NO_DAEMONIZE=true \
            apache/spark:4.2.1 \
            /opt/spark/sbin/start-connect-server.sh \
            --conf spark.connect.grpc.binding.address=0.0.0.0

      # A second server that cuts every stream after one second or 1 MiB,
      # so that the reattach test (Stage 2) reattaches hundreds of times.
      # The server buffers a result until the client releases it, and
      # range(10^8) outgrows the default 1 GiB driver heap.
      - name: Start a stream-cutting Spark Connect 4.2.1
        run: |
          docker run -d --name spark-cut -p 15003:15002 \
            -e SPARK_NO_DAEMONIZE=true \
            apache/spark:4.2.1 \
            /opt/spark/sbin/start-connect-server.sh \
            --driver-memory 3g \
            --conf spark.connect.grpc.binding.address=0.0.0.0 \
            --conf spark.connect.execute.reattachable.senderMaxStreamDuration=1s \
            --conf spark.connect.execute.reattachable.senderMaxStreamSize=1m

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::withr, any::DBI, any::dbplyr, any::dplyr

      - name: Install
        run: R CMD INSTALL .

      - name: Wait for Spark Connect
        timeout-minutes: 5
        run: |
          for name in spark spark-cut; do
            for i in $(seq 1 120); do
              if docker logs "$name" 2>&1 | grep -qi "Spark Connect server started"; then
                break
              fi
              sleep 2
            done
            docker logs "$name" 2>&1 | tail -5
            docker logs "$name" 2>&1 | grep -qi "Spark Connect server started"
          done

      - name: Run the live tests
        env:
          ZUSPARK_TEST_REMOTE: sc://127.0.0.1:15002
          ZUSPARK_TEST_REMOTE_CUT: sc://127.0.0.1:15003
          NOT_CRAN: "true"
        run: Rscript tools/ci-live-tests.R

      - name: Spark's logs
        if: failure()
        run: |
          docker logs spark 2>&1 | tail -100
          docker logs spark-cut 2>&1 | tail -100
