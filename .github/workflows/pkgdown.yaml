# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # The articles and examples run against Spark Connect 4.2.1, as in
      # live.yaml; started first, so that it boots while R installs.
      - name: Start Spark Connect 4.2.1
        run: |
          docker run -d --name spark -p 15002:15002 \
            -e SPARK_NO_DAEMONIZE=true \
            apache/spark:4.2.1 \
            /opt/spark/sbin/start-connect-server.sh \
            --conf spark.connect.grpc.binding.address=0.0.0.0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Wait for Spark Connect
        timeout-minutes: 5
        run: |
          for i in $(seq 1 120); do
            if docker logs spark 2>&1 | grep -qi "Spark Connect server started"; then
              break
            fi
            sleep 2
          done
          docker logs spark 2>&1 | tail -5
          docker logs spark 2>&1 | grep -qi "Spark Connect server started"

      - name: Build site
        env:
          SPARK_REMOTE: sc://127.0.0.1:15002
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          force: false
          branch: gh-pages
          folder: docs
